// A printed copy: check the PDF and approve it, then the address, then the price,
// then the order. Nothing goes to the printer before the approval.
const LULU_STATUS = {
  CREATED: ["Received by the printer", ""], UNPAID: ["Received by the printer", ""],
  PAYMENT_IN_PROGRESS: ["Being paid for at the printer", ""], PRODUCTION_DELAYED: ["Queued: printing starts within the hour", ""],
  PRODUCTION_READY: ["Ready to print", "good"], IN_PRODUCTION: ["Printing", "good"], SHIPPED: ["Shipped", "good"],
  REJECTED: ["The printer rejected the files, money back", "bad"], CANCELED: ["Canceled, money back", "bad"], ERROR: ["Problem at the printer", "bad"],
};
const STATES = "AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
function orderHtml(o) {
  const [label, tone] = o.status === "failed" ? ["Not placed, money back", "bad"] : o.status === "canceled" ? ["Canceled, money back", "bad"] : LULU_STATUS[o.luluStatus] || [o.luluStatus || o.status, ""];
  const a = o.address || {};
  return `<div class="orderline"><div class="row" style="justify-content:space-between"><b>Order #${o.id} · ${money(o.price)}</b><span class="pill ${tone}">${esc(label)}</span></div>
    <p class="note">${when(o.createdAt)} · to ${esc(a.name)}, ${esc(a.city)}, ${esc(a.state)} ${esc(a.zip)}${o.luluJobId ? ` · Ref. ${esc(o.luluJobId)}` : ""}</p>
    ${o.error ? `<p class="note">${esc(o.error)}</p>` : ""}
    ${o.tracking?.urls?.length ? `<p><a href="${esc(o.tracking.urls[0])}" target="_blank" rel="noopener">Track the parcel</a></p>` : ""}
    ${o.canCancel ? `<button class="linkish" data-cancel="${o.id}">Cancel this order and get the money back</button>` : ""}</div>`;
}

  };

  async function place() {
    const b = $("#place"); b.disabled = true; b.textContent = "Placing your order…";
    $("#oerr").innerHTML = "";

  }
}

        <div class="kpi"><span>Costs</span><b>${usd(costs)}</b><small>printing, card fees, AI</small></div>
        <div class="kpi hero"><span>Profit</span><b>${signed(profit)}</b><small>${sales ? Math.round((profit / sales) * 100) : 0}% of sales</small></div>
        <div class="kpi"><span>Customer balances</span><b>${usd((r.deposits - r.refundsToCards - r.books - r.prints) / 100)}</b><small>added but not yet spent</small></div>
      </div>
      <div class="cols">
        <div class="card"><h3>Where sales come from</h3>
          <ul class="lines">
            <li><span>Digital books</span><span>${usd(r.books / 100)}</span></li>${bar(r.books, Math.max(1, r.books + r.prints), "jack")}
            <li><span>Printed copies</span><span>${usd(r.prints / 100)}</span></li>${bar(r.prints, Math.max(1, r.books + r.prints), "red")}
          </ul>
          <ul class="lines quiet"><li><span>Added by customers (${r.depositCount} payments)</span><span>${usd(r.deposits / 100)}</span></li><li><span>Refunded to cards</span><span>${usd(r.refundsToCards / 100)}</span></li></ul>
        </div>
        <div class="card"><h3>Where costs go</h3>
          <ul class="lines">
            <li><span>Printing and shipping (Lulu)</span><span>${usd(r.luluCost / 100)}</span></li>${bar(r.luluCost / 100, Math.max(0.01, costs), "ink")}
            <li><span>AI illustration (${c.books} books)</span><span>${usd(api$)}</span></li>${bar(api$, Math.max(0.01, costs), "ink")}
            <li><span>Card fees (Stripe, estimated)</span><span>${usd(r.stripeFees / 100)}</span></li>${bar(r.stripeFees / 100, Math.max(0.01, costs), "ink")}
          </ul>
        </div>
      </div>
      <h3 class="sect">What each sale earns</h3>
      <div class="cols">
        ${product("Digital book", 0.99, [["AI illustration (average)", c.avg], ["Card fee on $0.99", stripe(99)]], bookCost)}
        ${product("Printed copy", a.pricing.print / 100, [["Lulu: print, ship, fee, tax", lulu], [`Card fee on ${money(a.pricing.print)}`, stripe(a.pricing.print)]], printCost)}
      </div>
      <p class="note sectnote">AI cost per book ranges ${usd(c.min, 3)}–${usd(c.max, 3)}: first tries ${usd(c.parts.firstTries, 3)}, redone pages ${usd(c.parts.retries, 3)}, quality checks ${usd(c.parts.checks, 3)}.</p>
    </section>

    <section data-panel="orders">
      ${a.orders.length ? `<div class="card flush"><div class="tablewrap"><table class="dt"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th class="num">Price</th><th class="num">Lulu</th><th class="num">Margin</th></tr></thead><tbody>
        ${a.orders.map((o) => { const [label, tone] = statusOf(o); return `<tr><td><b>#${o.id}</b><small>${when(o.createdAt)}${o.luluJobId ? ` · Lulu ${esc(o.luluJobId)}` : ""}</small></td><td>${esc(o.address?.name || "")}<small>${esc(o.email)}</small></td><td><span class="pill ${tone}">${esc(label)}</span></td><td class="num">${money(o.price)}</td><td class="num">${o.quote ? usd(o.quote.total) : "–"}</td><td class="num"><b>${o.margin != null ? signed(o.margin) : "–"}</b></td></tr>`; }).join("")}
      </tbody></table></div></div>` : `<div class="card empty"><p>No print orders yet.</p></div>`}
    </section>

    <section data-panel="books">
      <div class="card flush"><div class="tablewrap"><table class="dt"><thead><tr><th>Book</th><th>Customer</th><th>Status</th><th class="num">Made in</th><th class="num">AI cost</th><th>Pages redone</th></tr></thead><tbody>
        ${a.books.map((b) => `<tr><td><b>#${b.id}</b> <span class="dot" style="background:${COLORS[b.story]}"></span>${b.story === "red" ? "Little Red" : "Jack"}<small>starring ${esc(b.name)} · ${when(b.createdAt)}</small></td><td><small class="plain">${esc(b.email)}</small></td><td><span class="pill ${b.status === "done" ? "good" : b.status === "failed" ? "bad" : "info"}">${b.status === "done" ? "Finished" : b.status === "failed" ? "Failed" : "Making"}</span></td><td class="num">${b.seconds != null ? `${b.seconds} s` : "–"}</td><td class="num">${b.usd != null ? usd(b.usd, 3) : "–"}</td><td>${b.retried.length ? b.retried.map((p) => `<span class="chip">p${p.n}${p.tries > 2 ? ` ×${p.tries}` : ""}</span>`).join("") : `<span class="note">none</span>`}</td></tr>`).join("")}
      </tbody></table></div></div>
    </section>

    <section data-panel="system">
      <div class="cols">
        <div class="card"><h3>Printing</h3><ul class="lines quiet"><li><span>Product</span><span>${esc(a.printer.product)}</span></li><li><span>Lulu SKU</span><span><code>${esc(a.printer.pod)}</code></span></li><li><span>API</span><span>${esc(a.printer.base.replace("https://", ""))}${a.printer.configured ? "" : " (not set up)"}</span></li></ul></div>
        <div class="card"><h3>AI models</h3><ul class="lines quiet"><li><span>Illustrations</span><span><code>${esc(c.models.pages)}</code></span></li><li><span>Quality checks</span><span><code>${esc(c.models.checks)}</code></span></li><li><span>Prices last checked</span><span>${esc(c.pricesChecked)}</span></li></ul>
          <p style="margin-top:12px"><a href="/bible" target="_blank" rel="noopener">Open the character bible →</a></p></div>
      </div>
    </section>
  </div>`;
  const show = (k) => { adminTab = k; app.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== k)); app.querySelectorAll("[data-tab]").forEach((t) => t.setAttribute("aria-selected", t.dataset.tab === k)); };
  app.querySelectorAll("[data-tab]").forEach((t) => (t.onclick = () => show(t.dataset.tab)));
  show(adminTab);
  $("#alock").onclick = async () => { await post("/api/admin/logout", {}); viewAdmin(); };
}

function route() {
  stream?.close();
  document.documentElement.style.removeProperty("--story");
  const [, a, b] = location.hash.split("/");
  window.scrollTo(0, 0);
  // Signed-in pages wait for the sign-in check, so a link opened right after signing in lands where it should.
  if (me === undefined && ["new", "book", "money", "print"].includes(a)) { app.innerHTML = `<p class="note">Loading…</p>`; return; }
  if (a === "new") return viewNew(b);
  if (a === "book") return viewBook(+b);
  if (a === "money") return viewMoney();
  if (a === "print") return viewPrint(+b);
  if (a === "admin") return viewAdmin();
  viewHome();
}
addEventListener("hashchange", () => swap(route));
addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "ArrowRight") $("#next")?.click();
  if (e.key === "ArrowLeft") $("#prev")?.click();
});

// The page draws at once; the catalog and sign-in state fill in behind it.
viewHome();
fetch("/catalog.json").then((r) => r.json()).then((c) => { catalog = c; route(); });
refreshMe().then(async () => {
  const params = new URLSearchParams(location.search);
  const funded = params.get("funded");
  if (funded && me?.user) {
    history.replaceState(null, "", "/#/money");
    try { await post("/api/wallet/confirm", { sessionId: funded }); await refreshMe(); await viewMoney(`<div class="ok">Money added. Your balance is ${money(me.balance)}.</div>`); dropCoins(); return; } catch {}
  }
  if (params.get("signin")) history.replaceState(null, "", "/" + location.hash);
  route();
});
</script>
</body>
</html>
